          [ "$(tr -d '\r\n' < VERSION)" = "0.4.1" ]
          [ "$(git show HEAD:.github/workflows/ci.yml | sha256sum | cut -d' ' -f1)" = "f2cebc60e47213bd6624e74cad4dc4967af441ebb6d1b5fb705557fcd2cf3524" ]
          source_status=$(git status --porcelain --untracked-files=all -- . ':!router')
          [ -z "$source_status" ]
          [ "$(git -C router rev-parse HEAD)" = "3fff28de5790a341539b4a4d345cb76ae45681d7" ]
          [ "$(git -C router rev-list --parents -n 1 HEAD)" = "3fff28de5790a341539b4a4d345cb76ae45681d7 ee9a4a9e16f1e19491940db2e2da2ae8291ab765" ]
          [ "$(git -C router rev-parse HEAD^{tree})" = "3f8f591c125ce7be20ca2b7bf38d06a4de764c5d" ]
          [ "$(tr -d '\r\n' < router/VERSION)" = "0.4.1" ]
          [ "$(git -C router show HEAD:.github/workflows/ci.yml | sha256sum | cut -d' ' -f1)" = "c3b82190abaac03f38483fe8591df5a33282d59152bdaa1b650376aaabd19d3f" ]
          sibling_status=$(git -C router status --porcelain --untracked-files=all)
          [ -z "$sibling_status" ]
      - name: Old release trees
        run: |
          set -euo pipefail
          base=$RUNNER_TEMP/old-trees
          if command -v cygpath >/dev/null 2>&1; then base=$(cygpath -m "$base"); fi
          old_tree() {
            mkdir -p "$base/$2"
            archive="$base/$2.tar"
            git -C "$1" archive --format=tar --output="$archive" "$3"
            tar -xf - -C "$base/$2" < "$archive"
            rm "$archive"
            echo "$4=$base/$2" >> "$GITHUB_ENV"

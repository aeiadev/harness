          old_tree router router-0.2 421454545008e0c361def01049989df5b9056b83 ROUTER_V02
          old_tree . harness-0.1 063388b95632e935d53ba5ae058659b51960308d HARNESS_V01
          old_tree . harness-0.2 3b80d6fbaa3d15970e6f0e1409d141b952f0b7f2 HARNESS_V02
      - name: Shipping commands
        id: commands
        run: |
          set -euo pipefail
          result=0
          export EXPECTED_SIBLING="${ROUTER_CANDIDATE}"
          export ROUTER_DIR=router
          bash -eo pipefail -c 'set -euo pipefail
          ref=$(bash scripts/router-ref.sh resolve router VERSION "$EXPECTED_SIBLING")
          git -C router checkout -q --detach "$ref"
          ' || result=$?
          bash -eo pipefail -c 'python tests/run_all.py
          ' || result=$?
          bash -eo pipefail -c 'python codex/generate_agents.py --check
          ' || result=$?
          bash -eo pipefail -c 'cd agents
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c SHARED.sha256; else shasum -a 256 -c SHARED.sha256; fi
          ' || result=$?
          bash -eo pipefail -c 'python scripts/gen_plugin.py --check
          ' || result=$?
          bash -eo pipefail -c 'diff -r plugins/shared-roles router/plugins/shared-roles
          ' || result=$?
          bash -eo pipefail -c 'if command -v claude >/dev/null; then claude plugin validate .; claude plugin validate plugins/harness; claude plugin validate plugins/shared-roles; fi
          ' || result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Bounded scenario receipt
        if: ${{ always() && steps.commands.outcome == 'success' }}
        run: |

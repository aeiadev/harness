        run: |
          set -euo pipefail
          # The workflow runs from a child commit; source checkouts must be the exact parents.
          [ "$GITHUB_EVENT_NAME" = push ]
          [ "$GITHUB_REPOSITORY" = "aeiadev/harness" ]
          [ "$GITHUB_REF" = "refs/heads/ci/prepublish-041-harness" ]
          [ "$GITHUB_REF_NAME" = "ci/prepublish-041-harness" ]
          [ "$GITHUB_WORKFLOW_REF" = "aeiadev/harness/.github/workflows/ci.yml@refs/heads/ci/prepublish-041-harness" ]
          [ "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA" ]
          [ "$(git rev-list --parents -n 1 "$GITHUB_SHA")" = "$GITHUB_SHA c328e44a06c9a5176a8cb3776c341dd5b5b8cc18" ]
          [ "$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA")" = ".github/workflows/ci.yml" ]
          [ "$(git rev-parse HEAD)" = "c328e44a06c9a5176a8cb3776c341dd5b5b8cc18" ]
          [ "$(git rev-list --parents -n 1 HEAD)" = "c328e44a06c9a5176a8cb3776c341dd5b5b8cc18 13f151ebe601cda7ea24033fbf6f93eaa9bdbae2" ]

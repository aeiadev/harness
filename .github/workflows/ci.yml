name: Public 0.4.1 candidate CI
on:
  push:
    branches: [ci/prepublish-041-harness]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  ROUTER_CANDIDATE: 3fff28de5790a341539b4a4d345cb76ae45681d7
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - name: Keep checkouts LF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c328e44a06c9a5176a8cb3776c341dd5b5b8cc18
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Wait for sibling public object
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/release041-sibling.git"
          git init -q --bare "$mirror"
          found=0
          for attempt in {1..12}; do
            if GIT_TERMINAL_PROMPT=0 python -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[1:], stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=8).returncode)' git -c credential.helper= -C "$mirror" fetch -q "https://github.com/aeiadev/router.git" "+refs/heads/ci/prepublish-041-router:refs/heads/candidate-child"; then
              if [ "$(git -C "$mirror" rev-parse refs/heads/candidate-child^)" = "3fff28de5790a341539b4a4d345cb76ae45681d7" ] && [ "$(git -C "$mirror" diff --name-only refs/heads/candidate-child^ refs/heads/candidate-child)" = ".github/workflows/ci.yml" ] && git -C "$mirror" cat-file -e "3fff28de5790a341539b4a4d345cb76ae45681d7^{commit}"; then found=1; break; fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          [ "$found" -eq 1 ] || { echo 'sibling candidate child/object unavailable'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: aeiadev/router
          ref: 3fff28de5790a341539b4a4d345cb76ae45681d7
          path: router
          fetch-depth: 0
          persist-credentials: false
